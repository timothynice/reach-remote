name: Reach
options:
  bundleIdPrefix: design.timothynice.reach
  deploymentTarget:
    macOS: '14.0'
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  ReachMac:
    type: application
    platform: macOS
    sources: [Mac, Shared, Assets.xcassets]
    settings:
      base:
        PRODUCT_NAME: Reach
        PRODUCT_BUNDLE_IDENTIFIER: design.timothynice.reach.mac
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Reach discovers and securely connects your trusted iPhone or iPad to this Mac.
        INFOPLIST_FILE: Config/Mac-Info.plist
  ReachPhone:
    type: application
    platform: iOS
    sources: [iOS, Shared, Assets.xcassets]
    settings:
      base:
        PRODUCT_NAME: Reach
        PRODUCT_BUNDLE_IDENTIFIER: design.timothynice.reach.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_FILE: Config/iOS-Info.plist
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Reach finds your Mac so you can view and control it securely.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  ReachMac:
    build:
      targets:
        ReachMac: all
  ReachPhone:
    build:
      targets:
        ReachPhone: all
